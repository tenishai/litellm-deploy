# Generated by Gojira. The image tag is set by CI at deploy time
# (kustomize edit set image) — don't pin it by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: litellm
resources:
  - ../../base
labels:
  - pairs:
      gojira.dev/env: dev
# The registry is the install's (a repository variable CI reads), so the
# image name is set by CI together with the tag; nothing of it lives here.
images:
  - name: gojira-app
    newTag: latest
