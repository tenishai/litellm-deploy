# Generated by Gojira. Sizing comes from the 'web' workload class —
# override in gojira.yaml with a justification, not here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  labels:
    app.kubernetes.io/name: litellm
    gojira.dev/managed: "true"
    gojira.dev/class: web
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        gojira.dev/managed: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: litellm
      nodeSelector:
        kubernetes.io/arch: arm64
        cloud.google.com/compute-class: "Scale-Out"
      tolerations:
        - { key: kubernetes.io/arch, operator: Equal, value: arm64, effect: NoSchedule }
      containers:
        - name: app
          image: gojira-app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: VERTEX_LOCATION
              value: "us-central1"
            - name: VERTEX_PROJECT
              value: "shaz-learning"
          envFrom:
            - secretRef:
                name: litellm-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 4Gi
            limits:
              cpu: 1
              memory: 1Gi
              ephemeral-storage: 8Gi
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
