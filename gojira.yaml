# Gojira app spec — this file is the contract between your repo and Gojira.
# Change the class or add overrides here; Gojira regenerates the manifests
# when this file changes.
app: litellm
class: web
environments:
  - name: dev
    cluster: gojira-sandbox
    namespace: litellm
service_account: litellm
# ADC → Workload Identity. The platform owns the identity: it adopts the
# account below, grants the role on each environment's project, binds the
# pod's ServiceAccount to it and has CI annotate it — nothing hand-made,
# nothing in an overlay.
identity:
  gsa: litellm@shaz-learning.iam.gserviceaccount.com
  gcp_roles: [roles/aiplatform.user]
secrets_from: [litellm-secrets]
env:
  VERTEX_LOCATION: "us-central1"
  VERTEX_PROJECT: "shaz-learning"
arch: arm64                  # image platform + node arch; amd64 otherwise
node_selector:                # added to the pod verbatim (how this cluster provides arm64, a pool, …)
  cloud.google.com/compute-class: "Scale-Out"
health: /health/readiness
overrides:
  requests: { cpu: "250m", memory: "512Mi" }
  limits: { cpu: "1", memory: "1Gi" }
  hpa: { min: 1, max: 2 }
  justification: "a Python proxy with a loaded model map needs more than the web class's 256Mi; one replica serves the dogfood"
